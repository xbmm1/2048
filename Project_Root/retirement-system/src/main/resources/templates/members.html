<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Members')}"></head><body><header th:replace="~{layout :: header}"></header><main><div class="eyebrow">MEMBER SERVICES</div><h1>Member directory</h1><p>Review employment details and calculate a benefit from posted contributions.</p><form class="search" th:action="@{/members}" method="get"><label for="q">Name or member number</label><input id="q" name="q" th:value="${q}" placeholder="Try Alex or DEMO-1001"><button>Search</button></form><section class="card table-wrap"><table><thead><tr><th>Member</th><th>Number</th><th>Employer</th><th>Status</th></tr></thead><tbody><tr th:each="m : ${data.items}"><td><a th:href="@{/members/{id}(id=${m.id})}" th:text="${m.name}"></a></td><td th:text="${m.memberNumber}"></td><td th:text="${m.employer}"></td><td><span class="badge" th:text="${m.status}"></span></td></tr><tr th:if="${data.total == 0}"><td colspan="4">No members match this search.</td></tr></tbody></table></section><div class="pager"><a th:if="${data.page > 0}" th:href="@{/members(q=${q},page=${data.page-1})}">← Previous</a><span th:text="${data.total} + ' members'"></span><a th:if="${(data.page+1)*data.size < data.total}" th:href="@{/members(q=${q},page=${data.page+1})}">Next →</a></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
