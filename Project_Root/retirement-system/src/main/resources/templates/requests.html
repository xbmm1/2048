<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Retirement requests')}"></head><body><header th:replace="~{layout :: header}"></header><main><div class="eyebrow">RETIREMENT OPERATIONS</div><h1>Retirement requests</h1><p>Every retirement decision requires an independent reviewer.</p><div class="actions"><a th:href="@{/requests}">All requests</a><a th:href="@{/requests(status='SUBMITTED')}">Awaiting review</a></div><section class="card table-wrap"><table><thead><tr><th>Request</th><th>Member</th><th>Status</th><th>Created by</th></tr></thead><tbody><tr th:each="r : ${data.items}"><td><a th:href="@{/requests/{id}(id=${r.id})}" th:text="'#' + ${r.id}"></a></td><td th:text="${r.memberName}"></td><td><span class="badge" th:text="${r.status}"></span></td><td th:text="${r.createdBy}"></td></tr><tr th:if="${data.total == 0}"><td colspan="4">No requests here. Create one from an eligible saved estimate.</td></tr></tbody></table></section><div class="pager"><a th:if="${data.page > 0}" th:href="@{/requests(status=${status},page=${data.page-1})}">← Previous</a><span th:text="${data.total} + ' requests'"></span><a th:if="${(data.page+1)*data.size < data.total}" th:href="@{/requests(status=${status},page=${data.page+1})}">Next →</a></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
