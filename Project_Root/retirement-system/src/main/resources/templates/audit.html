<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Audit trail')}"></head><body><header th:replace="~{layout :: header}"></header><main><div class="eyebrow">ACCOUNTABILITY</div><h1>Audit trail</h1><p>A permanent record of who changed what. Events are committed with the business transaction.</p><section class="card table-wrap"><table><thead><tr><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Record</th><th>Detail</th></tr></thead><tbody><tr th:each="e : ${data.items}"><td th:text="${e.createdAt}"></td><td th:text="${e.actor}"></td><td th:text="${e.action}"></td><td th:text="${e.entityType} + ' #' + ${e.entityId}"></td><td th:text="${e.detail}"></td></tr><tr th:if="${data.total == 0}"><td colspan="5">No activity yet.</td></tr></tbody></table></section><div th:replace="~{layout :: pager(${data}, '/audit')}"></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
