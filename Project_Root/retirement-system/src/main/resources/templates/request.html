<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Request details')}"></head><body><header th:replace="~{layout :: header}"></header><main><a th:href="@{/requests}">← All requests</a><h1 th:text="'Retirement request #' + ${request.id}"></h1><p th:text="${request.memberName}"></p><section class="card"><span class="badge" th:text="${request.status}"></span><dl><dt>Created by</dt><dd th:text="${request.createdBy}"></dd><dt>Reviewed by</dt><dd th:text="${request.reviewedBy == null ? 'Awaiting review' : request.reviewedBy}"></dd><dt>Comments</dt><dd th:text="${request.comments == null ? 'None' : request.comments}"></dd></dl><a th:href="@{/estimates/{id}(id=${request.estimateId})}">View the saved calculation →</a><form th:if="${staff and request.status == 'DRAFT' and request.createdBy == username}" th:action="@{/requests/{id}/submit(id=${request.id})}" method="post"><input type="hidden" name="version" th:value="${request.version}"><button>Submit for approval</button></form><form th:if="${approver and request.status == 'SUBMITTED' and request.createdBy != username}" th:action="@{/requests/{id}/review(id=${request.id})}" method="post"><input type="hidden" name="version" th:value="${request.version}"><label for="comments">Review comments</label><textarea id="comments" name="comments" maxlength="1000" required rows="4"></textarea><div class="actions"><button name="approve" value="true">Approve retirement</button><button class="secondary" name="approve" value="false">Reject request</button></div></form></section></main><footer th:replace="~{layout :: footer}"></footer></body></html>
