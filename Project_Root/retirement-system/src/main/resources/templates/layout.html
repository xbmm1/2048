<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' · Retirement Lab'"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:fragment="header"><a class="brand" th:href="@{/}"><span class="mark">R</span> Retirement Lab <small>STAFF WORKSPACE</small></a><nav aria-label="Main"><a th:href="@{/members}">Members</a><a th:href="@{/imports}">Contributions</a><a th:href="@{/requests}">Requests</a><a th:href="@{/audit}">Audit trail</a></nav><form th:action="@{/logout}" method="post"><button class="quiet" type="submit">Sign out</button></form></header>
<footer th:fragment="footer"><span>Fictional pension rules. Synthetic member data. Learning use only.</span><span>Java · Spring · PostgreSQL</span></footer>
<div th:fragment="pager(data,base)" class="pager"><a th:if="${data.page > 0}" th:href="@{${base}(page=${data.page - 1})}">← Previous</a><span th:text="'Page ' + ${data.page + 1} + ' · ' + ${data.total} + ' records'"></span><a th:if="${(data.page + 1) * data.size < data.total}" th:href="@{${base}(page=${data.page + 1})}">Next →</a></div>
</body></html>
