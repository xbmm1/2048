<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Benefit estimate')}"></head><body><header th:replace="~{layout :: header}"></header><main><a th:href="@{/members/{id}(id=${member.id})}" th:text="'← ' + ${member.name}"></a><h1>Benefit estimate</h1><p th:text="'As of ' + ${estimate.asOf} + ' · Rule ' + ${estimate.ruleVersion}"></p><section class="stats"><article><span>Monthly pension</span><strong th:text="'$' + ${#numbers.formatDecimal(estimate.monthlyPension,1,'COMMA',2,'POINT')}"></strong></article><article><span>Annual pension</span><strong th:text="'$' + ${#numbers.formatDecimal(estimate.annualPension,1,'COMMA',2,'POINT')}"></strong></article><article><span>Posted service months</span><strong th:text="${estimate.serviceMonths}"></strong></article></section><section class="card"><span class="badge" th:text="${estimate.eligible ? 'ELIGIBLE' : 'NOT YET ELIGIBLE'}"></span><h2 th:text="${estimate.reason}"></h2><p th:text="'Age: ' + ${estimate.age} + ' · Average annual pay: $' + ${#numbers.formatDecimal(estimate.averageAnnualPay,1,'COMMA',2,'POINT')}"></p><p>This saved estimate preserves its original inputs. Later contribution imports do not change it. Amounts for ineligible members are illustrative only.</p><div class="actions"><a class="button secondary" th:href="@{/api/v1/reports/estimates/{id}.pdf(id=${estimate.id})}">Download PDF summary</a><form th:if="${staff and estimate.eligible and member.status == 'ACTIVE'}" th:action="@{/requests}" method="post"><input type="hidden" name="estimateId" th:value="${estimate.id}"><button>Create retirement request</button></form></div></section></main><footer th:replace="~{layout :: footer}"></footer></body></html>
