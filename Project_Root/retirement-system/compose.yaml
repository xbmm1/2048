services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: retirement
      POSTGRES_USER: retirement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-learning-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retirement-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retirement -d retirement"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/retirement
      DB_USER: retirement
      DB_PASSWORD: ${DB_PASSWORD:-local-learning-only}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  retirement-data:
