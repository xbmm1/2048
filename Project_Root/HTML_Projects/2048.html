<script>
  // Game variables
  const size = 4;
  let board = [];
  let score = 0;

  // DOM elements
  const gameBoard = document.getElementById('gameBoard');
  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const message = document.getElementById('message');
  const restartBtn = document.getElementById('restartBtn');
  const resetHighScoreBtn = document.getElementById('resetHighScoreBtn');
  const scoreChartCtx = document.getElementById('scoreChart').getContext('2d');

  let solverInterval = null;
let currentSolverStrategy = 'pattern'; // track which strategy is being used
let liveSolverPolicy = null;
const MOVE_DELAY = 50; // milliseconds delay between moves

function cloneBoard(board) {
  return board.map(row => row.slice());
}

function simulateMove(originalBoard, direction) {
  let boardClone = cloneBoard(originalBoard);
  let scoreGained = 0;

  function slideSim(row) {
    let arr = row.filter(v => v !== 0);
    for(let i=0; i < arr.length -1; i++) {
      if(arr[i] === arr[i+1]) {
        arr[i] *= 2;
        scoreGained += arr[i];
        arr[i+1] = 0;
        i++;
      }
    }
    arr = arr.filter(v => v !== 0);
    while(arr.length < boardClone.length) arr.push(0);
    return arr;
  }

  let moved = false;
  const size = boardClone.length;

  switch(direction) {
    case 'left':
      for(let r=0; r<size; r++) {
        let newRow = slideSim(boardClone[r]);
        if(newRow.toString() !== boardClone[r].toString()) {
          moved = true;
          boardClone[r] = newRow;
        }
      }
      break;
    case 'right':
      for(let r=0; r<size; r++) {
        let reversed = boardClone[r].slice().reverse();
        let newRow = slideSim(reversed);
        newRow.reverse();
        if(newRow.toString() !== boardClone[r].toString()) {
          moved = true;
          boardClone[r] = newRow;
        }
      }
      break;
    case 'up':
      for(let c=0; c<size; c++) {
        let col = [];
        for(let r=0; r<size; r++) col.push(boardClone[r][c]);
        let newCol = slideSim(col);
        for(let r=0; r<size; r++) {
          if(boardClone[r][c] !== newCol[r]) {
            moved = true;
            boardClone[r][c] = newCol[r];
          }
        }
      }
      break;
    case 'down':
      for(let c=0; c<size; c++) {
        let col = [];
        for(let r=0; r<size; r++) col.push(boardClone[r][c]);
        let reversed = col.slice().reverse();
        let newCol = slideSim(reversed);
        newCol.reverse();
        for(let r=0; r<size; r++) {
          if(boardClone[r][c] !== newCol[r]) {
            moved = true;
            boardClone[r][c] = newCol[r];
          }
        }
      }
      break;
  }

  return { board: boardClone, moved, scoreGained };
}

// ============ PURE SIMULATION HELPERS FOR 100-GAME SIMULATOR ============

function createEmptyBoard() {
  const newBoard = [];
  for(let i=0; i<size; i++) {
    newBoard[i] = [];
    for(let j=0; j<size; j++) {
      newBoard[i][j] = 0;
    }
  }
  return newBoard;
}

function addRandomTileTo(board) {
  let empty = [];
  for(let r=0; r<size; r++) {
    for(let c=0; c<size; c++) {
      if(board[r][c] === 0) empty.push({r, c});
    }
  }
  if(empty.length === 0) return board;
  
  const newBoard = cloneBoard(board);
  const {r, c} = empty[Math.floor(Math.random() * empty.length)];
  newBoard[r][c] = Math.random() < 0.9 ? 2 : 4;
  return newBoard;
}

function applyMove(board, direction) {
  return simulateMove(board, direction);
}

function isGameOverBoard(board) {
  for(let r=0; r<size; r++) {
    for(let c=0; c<size; c++) {
      if(board[r][c] === 0) return false;
      if(c < size -1 && board[r][c] === board[r][c+1]) return false;
      if(r < size -1 && board[r][c] === board[r+1][c]) return false;
    }
  }
  return true;
}

function getMaxTile(board) {
  let max = 0;
  for(let r=0; r<size; r++) {
    for(let c=0; c<size; c++) {
      if(board[r][c] > max) max = board[r][c];
    }
  }
  return max;
}

// Random move policy for simulator - tries all directions, picking first that works
function randomPolicy(board) {
  const dirs = ['up', 'down', 'left', 'right'];
  // Shuffle directions for randomness
  for(let i = dirs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
  }
  for(let i=0; i<dirs.length; i++) {
    const result = applyMove(board, dirs[i]);
    if(result.moved) return dirs[i];
  }
  return null;
}

// Pattern solver policy factory for simulator (returns a policy with local state)
function createPatternPolicy() {
  let leftRightPhase = 0; // local state per policy instance

  return function policy(board) {
    // Preference order (what we WANT), but we will always fall back to any movable direction.
    const preference = ['up', 'right'];

    // Prefer alternating left/right, but don't fail if that chosen one is blocked.
    preference.push(leftRightPhase === 0 ? 'left' : 'right');
    preference.push(leftRightPhase === 0 ? 'right' : 'left');

    // Critical fallback so simulator doesn't prematurely end while moves remain.
    preference.push('down');

    for (const dir of preference) {
      const result = applyMove(board, dir);
      if (result.moved) {
        // Maintain the left/right alternation only when we successfully move horizontally.
        if (dir === 'left' || dir === 'right') {
          leftRightPhase = 1 - leftRightPhase;
        }
        return dir;
      }
    }

    // Only return null when absolutely no direction moves (true stalemate).
    return null;
  };
}


// Corner stacking policy factory - keeps highest tiles in corner, maintains empty space
function createCornerStackPolicy() {
  return function policy(board) {
    // Strategy: keep highest tile in bottom-right corner
    // Moves: Down, Right (to stack in corner), then Left, Up for variety
    
    const directions = ['down', 'right', 'left', 'up'];
    
    for(let dir of directions) {
      const result = applyMove(board, dir);
      if(result.moved) return dir;
    }
    
    return null;
  };
}

// Advanced corner policy - evaluates moves by board state fitness
function createAdvancedCornerPolicy() {
  const dirs = ['down', 'right', 'left', 'up'];
  const evalCache = new Map();

  function boardKey(b) {
    return b.map(row => row.join(',')).join('|');
  }

  function getEmptyCells(b) {
    const cells = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (b[r][c] === 0) cells.push({ r, c });
      }
    }
    return cells;
  }

  function placeTile(b, r, c, value) {
    const copy = cloneBoard(b);
    copy[r][c] = value;
    return copy;
  }

  function getMaxTilePos(b) {
    let maxVal = 0, maxR = 0, maxC = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (b[r][c] > maxVal) {
          maxVal = b[r][c];
          maxR = r;
          maxC = c;
        }
      }
    }
    return { val: maxVal, r: maxR, c: maxC };
  }

  function buildExpBoard(b) {
    const e = [];
    for (let r = 0; r < size; r++) {
      e[r] = [];
      for (let c = 0; c < size; c++) {
        e[r][c] = b[r][c] === 0 ? 0 : Math.log2(b[r][c]);
      }
    }
    return e;
  }

  function countMergePotential(b) {
    let count = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const v = b[r][c];
        if (v === 0) continue;
        if (c + 1 < size && b[r][c + 1] === v) count++;
        if (r + 1 < size && b[r + 1][c] === v) count++;
      }
    }
    return count;
  }

  function smoothnessPenalty(exp) {
    let penalty = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const v = exp[r][c];
        if (v === 0) continue;
        if (c + 1 < size && exp[r][c + 1] !== 0) {
          penalty += Math.abs(v - exp[r][c + 1]);
        }
        if (r + 1 < size && exp[r + 1][c] !== 0) {
          penalty += Math.abs(v - exp[r + 1][c]);
        }
      }
    }
    return penalty;
  }

  function monotonicityPenalty(exp) {
    let penalty = 0;

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size - 1; c++) {
        if (exp[r][c] > exp[r][c + 1]) {
          penalty += exp[r][c] - exp[r][c + 1];
        }
      }
    }

    for (let c = 0; c < size; c++) {
      for (let r = 0; r < size - 1; r++) {
        if (exp[r][c] > exp[r + 1][c]) {
          penalty += exp[r][c] - exp[r + 1][c];
        }
      }
    }

    return penalty;
  }

  function evaluateBoard(b) {
    const key = boardKey(b);
    if (evalCache.has(key)) return evalCache.get(key);

    const exp = buildExpBoard(b);
    const empty = getEmptyCells(b).length;
    const mergePotential = countMergePotential(b);
    const smoothPenalty = smoothnessPenalty(exp);
    const monoPenalty = monotonicityPenalty(exp);

    const max = getMaxTilePos(b);
    const maxExp = max.val === 0 ? 0 : Math.log2(max.val);
    const dist = Math.abs(3 - max.r) + Math.abs(3 - max.c);

    let cornerScore = 0;
    if (max.r === 3 && max.c === 3) {
      cornerScore = 1200 + maxExp * 120;
    } else {
      cornerScore = -dist * 160;
    }

    const value =
      empty * 240 +
      mergePotential * 180 +
      cornerScore -
      smoothPenalty * 22 -
      monoPenalty * 65;

    evalCache.set(key, value);
    return value;
  }

  function sampleArray(arr, limit) {
    if (arr.length <= limit) return arr;
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, limit);
  }

  function expectedSpawnValue(b) {
    const empties = getEmptyCells(b);
    if (empties.length === 0) return evaluateBoard(b);

    const sampled = sampleArray(empties, 6);
    let total = 0;

    for (const { r, c } of sampled) {
      total += 0.9 * evaluateBoard(placeTile(b, r, c, 2));
      total += 0.1 * evaluateBoard(placeTile(b, r, c, 4));
    }

    return total / sampled.length;
  }

  return function policy(board) {
    const beforeMax = getMaxTilePos(board);

    let bestMove = null;
    let bestScore = -Infinity;

    for (const dir of dirs) {
      const result = applyMove(board, dir);
      if (!result.moved) continue;

      let cornerBreakPenalty = 0;
      if (
        beforeMax.r === 3 &&
        beforeMax.c === 3 &&
        result.board[3][3] !== beforeMax.val
      ) {
        cornerBreakPenalty = 500;
      }

      const candidateScore =
        result.scoreGained * 12 +
        expectedSpawnValue(result.board) -
        cornerBreakPenalty;

      if (candidateScore > bestScore) {
        bestScore = candidateScore;
        bestMove = dir;
      }
    }

    return bestMove;
  };
}

// Expectimax policy - deeper lookahead over random spawns
function createExpectimaxPolicy() {
  const dirs = ['up', 'right', 'down', 'left'];
  const maxDepth = 3;
  const spawnSampleLimit = 6;
  const evalCache = new Map();

  function boardKey(b) {
    return b.map(row => row.join(',')).join('|');
  }

  function getEmptyCells(b) {
    const cells = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (b[r][c] === 0) cells.push({ r, c });
      }
    }
    return cells;
  }

  function placeTile(b, r, c, value) {
    const copy = cloneBoard(b);
    copy[r][c] = value;
    return copy;
  }

  function getMaxTilePos(b) {
    let maxVal = 0;
    let maxR = 0;
    let maxC = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (b[r][c] > maxVal) {
          maxVal = b[r][c];
          maxR = r;
          maxC = c;
        }
      }
    }
    return { val: maxVal, r: maxR, c: maxC };
  }

  function buildExpBoard(b) {
    const e = [];
    for (let r = 0; r < size; r++) {
      e[r] = [];
      for (let c = 0; c < size; c++) {
        e[r][c] = b[r][c] === 0 ? 0 : Math.log2(b[r][c]);
      }
    }
    return e;
  }

  function monotonicityScore(exp) {
    let score = 0;

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size - 1; c++) {
        score += exp[r][c] - exp[r][c + 1];
      }
    }

    for (let c = 0; c < size; c++) {
      for (let r = 0; r < size - 1; r++) {
        score += exp[r + 1][c] - exp[r][c];
      }
    }

    return score;
  }

  function smoothnessPenalty(exp) {
    let penalty = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const v = exp[r][c];
        if (v === 0) continue;
        if (c + 1 < size && exp[r][c + 1] !== 0) {
          penalty += Math.abs(v - exp[r][c + 1]);
        }
        if (r + 1 < size && exp[r + 1][c] !== 0) {
          penalty += Math.abs(v - exp[r + 1][c]);
        }
      }
    }
    return penalty;
  }

  function mergePotential(b) {
    let count = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const v = b[r][c];
        if (v === 0) continue;
        if (c + 1 < size && b[r][c + 1] === v) count++;
        if (r + 1 < size && b[r + 1][c] === v) count++;
      }
    }
    return count;
  }

  function evaluateBoard(b) {
    const key = boardKey(b);
    if (evalCache.has(key)) return evalCache.get(key);

    const exp = buildExpBoard(b);
    const empties = getEmptyCells(b).length;
    const max = getMaxTilePos(b);
    const cornerDist = Math.abs(3 - max.r) + Math.abs(3 - max.c);
    const maxExp = max.val === 0 ? 0 : Math.log2(max.val);

    const value =
      empties * 260 +
      monotonicityScore(exp) * 70 -
      smoothnessPenalty(exp) * 20 +
      mergePotential(b) * 180 +
      (max.r === 3 && max.c === 3 ? 1400 + maxExp * 150 : -cornerDist * 220);

    evalCache.set(key, value);
    return value;
  }

  function sampleArray(arr, limit) {
    if (arr.length <= limit) return arr;
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, limit);
  }

  function expectimaxValue(stateBoard, depth, isChanceNode) {
    if (depth === 0 || isGameOverBoard(stateBoard)) {
      return evaluateBoard(stateBoard);
    }

    if (!isChanceNode) {
      let best = -Infinity;
      let hasMove = false;

      for (const dir of dirs) {
        const result = applyMove(stateBoard, dir);
        if (!result.moved) continue;
        hasMove = true;

        const value = result.scoreGained * 14 + expectimaxValue(result.board, depth - 1, true);
        if (value > best) best = value;
      }

      return hasMove ? best : evaluateBoard(stateBoard);
    }

    const empties = getEmptyCells(stateBoard);
    if (empties.length === 0) {
      return expectimaxValue(stateBoard, depth - 1, false);
    }

    const sampled = sampleArray(empties, spawnSampleLimit);
    let expected = 0;

    for (const { r, c } of sampled) {
      const withTwo = placeTile(stateBoard, r, c, 2);
      const withFour = placeTile(stateBoard, r, c, 4);
      expected += 0.9 * expectimaxValue(withTwo, depth - 1, false);
      expected += 0.1 * expectimaxValue(withFour, depth - 1, false);
    }

    return expected / sampled.length;
  }

  return function policy(board) {
    let bestMove = null;
    let bestScore = -Infinity;

    for (const dir of dirs) {
      const result = applyMove(board, dir);
      if (!result.moved) continue;

      const value = result.scoreGained * 14 + expectimaxValue(result.board, maxDepth - 1, true);
      if (value > bestScore) {
        bestScore = value;
        bestMove = dir;
      }
    }

    return bestMove;
  };
}



// Single game simulation - returns {score, steps, maxTile, durationMs}
function runSingleSimulation(policy) {
  const startTime = performance.now();
  let gameBoard = createEmptyBoard();
  gameBoard = addRandomTileTo(gameBoard);
  gameBoard = addRandomTileTo(gameBoard);
  
  let gameScore = 0;
  let steps = 0;
  
  while(!isGameOverBoard(gameBoard) && steps < 10000) {
    const dir = policy(gameBoard);
    if(!dir) break;
    
    const result = applyMove(gameBoard, dir);
    if(!result.moved) break;
    
    gameBoard = result.board;
    gameScore += result.scoreGained;
    gameBoard = addRandomTileTo(gameBoard);
    steps++;
  }
  
  const maxTile = getMaxTile(gameBoard);
  const durationMs = performance.now() - startTime;
  
  return { score: gameScore, steps: steps, maxTile: maxTile, durationMs: durationMs };
}

// Compute statistics from array of values
function computeStats(values) {
  if(values.length === 0) return {};
  
  const sorted = [...values].sort((a,b) => a - b);
  const count = values.length;
  const min = sorted[0];
  const max = sorted[count - 1];
  const mean = values.reduce((a,b) => a+b, 0) / count;
  const median = count % 2 === 0 
    ? (sorted[count/2 - 1] + sorted[count/2]) / 2 
    : sorted[Math.floor(count/2)];
  
  const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / count;
  const stddev = Math.sqrt(variance);
  
  const p10 = sorted[Math.floor(count * 0.1)];
  const p25 = sorted[Math.floor(count * 0.25)];
  const p50 = median;
  const p75 = sorted[Math.floor(count * 0.75)];
  const p90 = sorted[Math.floor(count * 0.9)];
  
  return { count, min, max, mean, median, stddev, p10, p25, p50, p75, p90 };
}

// ============ WEB WORKER PARALLEL SIMULATION ============
// The worker source is built by serializing the *real* pure functions above
// (via .toString()) so there is a single source of truth - no hand-copied
// duplicate to keep in sync. These functions must not reference anything
// outside themselves other than `size` (re-declared below) and each other.

// Defined only so its source can be extracted via .toString() - never called
// directly on the main thread.
function workerOnMessage(e) {
  const { policyName, gamesToRun, workerId } = e.data;
  let policyFactory;
  if (policyName === 'pattern') policyFactory = createPatternPolicy;
  else if (policyName === 'cornerStack') policyFactory = createCornerStackPolicy;
  else if (policyName === 'advancedCorner') policyFactory = createAdvancedCornerPolicy;
  else if (policyName === 'expectimax') policyFactory = createExpectimaxPolicy;
  else policyFactory = () => randomPolicy;

  const scores = [];
  const maxTiles = [];
  const durations = [];

  for (let i = 0; i < gamesToRun; i++) {
    const policy = policyFactory();
    const result = runSingleSimulation(policy);
    scores.push(result.score);
    maxTiles.push(result.maxTile);
    durations.push(result.durationMs);

    if ((i + 1) % 5 === 0 || i === gamesToRun - 1) {
      self.postMessage({ type: 'progress', workerId, completed: i + 1 });
    }
  }

  self.postMessage({ type: 'done', workerId, scores, maxTiles, durations });
}

const WORKER_SOURCE = [
  'const size = 4;',
  cloneBoard.toString(),
  simulateMove.toString(),
  createEmptyBoard.toString(),
  addRandomTileTo.toString(),
  applyMove.toString(),
  isGameOverBoard.toString(),
  getMaxTile.toString(),
  randomPolicy.toString(),
  createPatternPolicy.toString(),
  createCornerStackPolicy.toString(),
  createAdvancedCornerPolicy.toString(),
  createExpectimaxPolicy.toString(),
  runSingleSimulation.toString(),
  'self.onmessage = ' + workerOnMessage.toString() + ';'
].join('\n\n');

let workerBlobUrl = null;
function getWorkerBlobUrl() {
  if (!workerBlobUrl) {
    const blob = new Blob([WORKER_SOURCE], { type: 'application/javascript' });
    workerBlobUrl = URL.createObjectURL(blob);
  }
  return workerBlobUrl;
}

// Runs `count` games split across multiple Web Workers (one per logical CPU
// core) so multi-depth policies like Expectimax use all available cores.
// Falls back to the single-threaded simulateNGames() if Workers aren't
// available in the current environment.
async function simulateNGamesParallel(count, policyName) {
  if (typeof Worker === 'undefined') {
    return simulateNGames(count, policyName);
  }

  const numWorkers = Math.max(1, Math.min(count, navigator.hardwareConcurrency || 4));
  const workerUrl = getWorkerBlobUrl();

  // Split games into per-worker chunks; remainder goes to the first workers.
  const baseChunk = Math.floor(count / numWorkers);
  let remainder = count % numWorkers;
  const chunkSizes = [];
  for (let i = 0; i < numWorkers; i++) {
    const chunk = baseChunk + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
    chunkSizes.push(chunk);
  }

  const progressPerWorker = new Array(numWorkers).fill(0);
  const progressEl = document.getElementById('simProgress');
  const updateProgress = () => {
    const completed = progressPerWorker.reduce((a, b) => a + b, 0);
    if (progressEl) progressEl.textContent = `Progress: ${completed}/${count} (${numWorkers} workers)`;
  };

  const totalStartTime = performance.now();

  const workerPromises = chunkSizes.map((gamesToRun, workerId) => {
    if (gamesToRun === 0) return Promise.resolve({ scores: [], maxTiles: [], durations: [] });

    return new Promise((resolve, reject) => {
      const worker = new Worker(workerUrl);

      worker.onmessage = (e) => {
        const msg = e.data;
        if (msg.type === 'progress') {
          progressPerWorker[workerId] = msg.completed;
          updateProgress();
        } else if (msg.type === 'done') {
          worker.terminate();
          resolve({ scores: msg.scores, maxTiles: msg.maxTiles, durations: msg.durations });
        }
      };

      worker.onerror = (err) => {
        worker.terminate();
        reject(err);
      };

      worker.postMessage({ policyName, gamesToRun, workerId });
    });
  });

  const chunkResults = await Promise.all(workerPromises);
  const totalDurationMs = performance.now() - totalStartTime;

  const scores = [];
  const maxTiles = [];
  const durations = [];
  for (const r of chunkResults) {
    scores.push(...r.scores);
    maxTiles.push(...r.maxTiles);
    durations.push(...r.durations);
  }

  const scoreStats = computeStats(scores);

  const maxTileDist = {};
  maxTiles.forEach(tile => {
    maxTileDist[tile] = (maxTileDist[tile] || 0) + 1;
  });

  return {
    scores,
    maxTiles,
    durations,
    scoreStats,
    maxTileDist,
    totalDurationMs
  };
}

// Async batch runner for N games with progress updates
async function simulateNGames(count, policyName) {
  const scores = [];
  const maxTiles = [];
  const durations = [];
  
  let policyFactory;
  if(policyName === 'pattern') policyFactory = createPatternPolicy;
  else if(policyName === 'cornerStack') policyFactory = createCornerStackPolicy;
  else if(policyName === 'advancedCorner') policyFactory = createAdvancedCornerPolicy;
  else if(policyName === 'expectimax') policyFactory = createExpectimaxPolicy;
  else policyFactory = () => randomPolicy;
  
  const totalStartTime = performance.now();
  
  const batchSize = 10;
  for(let i = 0; i < count; i++) {
    const policy = policyFactory();
    const result = runSingleSimulation(policy);
    scores.push(result.score);
    maxTiles.push(result.maxTile);
    durations.push(result.durationMs);
    
    // Update progress
    document.getElementById('simProgress').textContent = `Progress: ${i+1}/${count}`;
    
    // Yield every batch to avoid blocking UI
    if((i + 1) % batchSize === 0) {
      await new Promise(r => setTimeout(r, 0));
    }
  }
  
  const totalDurationMs = performance.now() - totalStartTime;
  const scoreStats = computeStats(scores);
  
  // Count max tile distribution
  const maxTileDist = {};
  maxTiles.forEach(tile => {
    maxTileDist[tile] = (maxTileDist[tile] || 0) + 1;
  });
  
  return {
    scores: scores,
    maxTiles: maxTiles,
    durations: durations,
    scoreStats: scoreStats,
    maxTileDist: maxTileDist,
    totalDurationMs: totalDurationMs
  };
}

// Display simulation results and save to localStorage
async function displaySimulationResults(policyName) {
  const runSimBtn = document.getElementById('runSimBtn');
  const simProgress = document.getElementById('simProgress');
  const simResults = document.getElementById('simResults');
  
  runSimBtn.disabled = true;
  runSimBtn.textContent = 'Running...';
  simProgress.style.display = 'block';
  simResults.style.display = 'none';
  
  try {
    const results = await simulateNGamesParallel(1000, policyName);
    
    const stats = results.scoreStats;
    const maxTileDist = results.maxTileDist;
    
    // Format .info() output
    let infoText = `=== Simulation Results: 1000 Games (${policyName.toUpperCase()} Policy) ===\n`;
    infoText += `Count: ${stats.count}\n`;
    infoText += `Min Score: ${Math.round(stats.min)}\n`;
    infoText += `Max Score: ${Math.round(stats.max)}\n`;
    infoText += `Mean: ${stats.mean.toFixed(2)}\n`;
    infoText += `Median: ${Math.round(stats.median)}\n`;
    infoText += `Stddev: ${stats.stddev.toFixed(2)}\n`;
    infoText += `P10: ${Math.round(stats.p10)}\n`;
    infoText += `P25: ${Math.round(stats.p25)}\n`;
    infoText += `P50: ${Math.round(stats.p50)}\n`;
    infoText += `P75: ${Math.round(stats.p75)}\n`;
    infoText += `P90: ${Math.round(stats.p90)}\n`;
    infoText += `\nMax Tile Distribution:\n`;
    
    Object.keys(maxTileDist).sort((a,b) => b-a).forEach(tile => {
      infoText += `  ${tile}: ${maxTileDist[tile]} games\n`;
    });
    
    infoText += `\nTotal Duration: ${(results.totalDurationMs / 1000).toFixed(2)}s\n`;
    infoText += `Avg Per Game: ${(results.totalDurationMs / 1000).toFixed(2)}ms\n`;
    
    // Save to localStorage under separate key
    const session = {
      id: Date.now(),
      date: new Date().toISOString(),
      policy: policyName,
      count: 1000,
      scores: results.scores,
      stats: stats,
      maxTileDist: maxTileDist,
      totalDurationMs: results.totalDurationMs
    };
    
    let simulations = JSON.parse(localStorage.getItem('simulationResults')) || [];
    simulations.push(session);
    localStorage.setItem('simulationResults', JSON.stringify(simulations));
    
    // Display results
    simResults.textContent = infoText;
    simResults.style.display = 'block';
    simProgress.textContent = `Completed 1000 games in ${(results.totalDurationMs / 1000).toFixed(2)}s`;
    
  } catch(err) {
    console.error('Simulation error:', err);
    simResults.textContent = 'Error running simulation: ' + err.message;
    simResults.style.display = 'block';
  } finally {
    runSimBtn.disabled = false;
    runSimBtn.textContent = 'Run 1000 Games';
  }
}

// History stack for undo functionality
const MAX_UNDO = 15; // cap history length
let history = [];

function saveStateForUndo() {
  // Save a deep copy of the board and relevant state
  history.push({ board: cloneBoard(board), score: score, highScore: highScore, message: message.textContent });
  // Enforce cap (remove oldest if over limit)
  if (history.length > MAX_UNDO) history.shift();
  updateUndoButton();
}

function updateUndoButton() {
  const btn = document.getElementById('undoBtn');
  if (!btn) return;
  btn.disabled = history.length === 0;
}

function undo() {
  if (history.length === 0) return;
  const prev = history.pop();
  board = cloneBoard(prev.board);
  score = prev.score;
  highScore = prev.highScore || 0;
  message.textContent = prev.message || '';
  // Restore displayed high score and storage
  localStorage.setItem('highScore', highScore);
  updateBoard();
  updateScore();
  updateUndoButton();
}

function createPolicyForStrategy(strategyName) {
  if (strategyName === 'pattern') return createPatternPolicy();
  if (strategyName === 'cornerStack') return createCornerStackPolicy();
  if (strategyName === 'advancedCorner') return createAdvancedCornerPolicy();
  if (strategyName === 'expectimax') return createExpectimaxPolicy();
  return randomPolicy;
}

function resetLiveSolverPolicy() {
  liveSolverPolicy = createPolicyForStrategy(currentSolverStrategy);
}

function stopSolver() {
  if (solverInterval !== null) {
    clearInterval(solverInterval);
    solverInterval = null;
  }
  const patternBtn = document.getElementById('patternSolverBtn');
  if (patternBtn) patternBtn.textContent = 'Run Pattern Solver (R)';
}

function startSolver() {
  if (message.textContent !== '' || solverInterval !== null) return;

  const strategySelect = document.getElementById('solverStrategySelect');
  currentSolverStrategy = strategySelect ? strategySelect.value : currentSolverStrategy;
  resetLiveSolverPolicy();

  const patternBtn = document.getElementById('patternSolverBtn');
  if (patternBtn) patternBtn.textContent = 'Stop Pattern Solver';

  solverInterval = setInterval(() => {
    patternSolverLoop();
    if (message.textContent !== '') {
      stopSolver();
    }
  }, MOVE_DELAY);
}

function patternSolverLoop() {
  if (message.textContent !== '') {
    // Game over or stopped, stop interval and reset button text
    stopSolver();
    return;
  }

  if (!liveSolverPolicy) {
    resetLiveSolverPolicy();
  }

  const dir = liveSolverPolicy(board);
  
  if(dir) {
    move(dir);
  }
}

// Button event listener to start/stop the solver loop
document.addEventListener('DOMContentLoaded', () => {
  const patternBtn = document.getElementById('patternSolverBtn');
  const strategySelect = document.getElementById('solverStrategySelect');
  
  if(strategySelect) {
    strategySelect.addEventListener('change', (e) => {
      currentSolverStrategy = e.target.value;
      if (solverInterval !== null) {
        resetLiveSolverPolicy();
      }
    });
  }
  
  if (patternBtn) {
    patternBtn.addEventListener('click', () => {
      if (solverInterval !== null) {
        stopSolver();
        return;
      }
      startSolver();
    });
  }
});


  // Load high score from localStorage or default to 0
  let highScore = parseInt(localStorage.getItem('highScore')) || 0;
  highScoreDisplay.textContent = 'High Score: ' + highScore;

  // Load all past scores from localStorage or empty array
  let scores = JSON.parse(localStorage.getItem('scores')) || [];

  // Chart instance holder
  let scoreChartInstance = null;

  // Initialize game board with zeros and add two tiles
  function initBoard() {
    board = [];
    score = 0;
    message.textContent = '';
    // Clear undo history on new game
    history = [];
    updateUndoButton();
    for(let i=0; i<size; i++) {
      board[i] = [];
      for(let j=0; j<size; j++) {
        board[i][j] = 0;
      }
    }
    addRandomTile();
    addRandomTile();
    updateBoard();
    updateScore();
  }

  // Add a random tile (2 or 4) in an empty spot
  function addRandomTile() {
    let empty = [];
    for(let r=0; r<size; r++) {
      for(let c=0; c<size; c++) {
        if(board[r][c] === 0) empty.push({r, c});
      }
    }
    if(empty.length === 0) return;
    const {r, c} = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  // Render the board visually
  function updateBoard() {
    gameBoard.innerHTML = '';
    for(let r=0; r<size; r++) {
      for(let c=0; c<size; c++) {
        const val = board[r][c];
        const tile = document.createElement('div');
        tile.classList.add('tile');
        if(val !== 0) {
          tile.classList.add('tile-' + val);
          tile.textContent = val;
        }
        gameBoard.appendChild(tile);
      }
    }
  }

  // Update the current score and high score displays
  function updateScore() {
    scoreDisplay.textContent = 'Score: ' + score;
    if(score > highScore) {
      highScore = score;
      localStorage.setItem('highScore', highScore);
      highScoreDisplay.textContent = 'High Score: ' + highScore;
    }
  }

  // Slide and merge one row or column
  function slide(row) {
    let arr = row.filter(v => v !== 0);
    for(let i=0; i < arr.length - 1; i++) {
      if(arr[i] === arr[i+1]) {
        arr[i] *= 2;
        score += arr[i];
        arr[i+1] = 0;
        i++;
      }
    }
    arr = arr.filter(v => v !== 0);
    while(arr.length < size) arr.push(0);
    return arr;
  }

  // Perform move in given direction (uses simulateMove to detect change)
  function move(direction) {
    if (message.textContent !== '') return;
    const sim = simulateMove(board, direction);
    if (!sim.moved) return;

    // Save previous state for undo
    saveStateForUndo();

    // Apply simulated result
    board = sim.board;
    score += sim.scoreGained;
    addRandomTile();
    updateBoard();
    updateScore();

    if (checkGameOver()) {
      message.textContent = 'Game Over! Press Restart to try again.';
      saveScore(score); // Save score on game over
    }
  }

  // Check if no moves left (game over)
  function checkGameOver() {
    for(let r=0; r<size; r++) {
      for(let c=0; c<size; c++) {
        if(board[r][c] === 0) return false;
        if(c < size -1 && board[r][c] === board[r][c+1]) return false;
        if(r < size -1 && board[r][c] === board[r+1][c]) return false;
      }
    }
    return true;
  }

  // Save a new score to localStorage scores array
  function saveScore(newScore) {
    scores.push({ score: newScore, date: new Date().toISOString() });
    localStorage.setItem('scores', JSON.stringify(scores));
    plotScores();
    displayAverageScore();
  }

  // Plot scores on the chart using Chart.js
  function plotScores() {
  const labels = scores.map((entry) => {
    const d = new Date(entry.date);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
  });
  const data = scores.map(entry => entry.score);

  // Calculate average score
  const averageScore = data.length > 0 ? data.reduce((a, b) => a + b, 0) / data.length : 0;

  // Create an array with the average repeated for each label (to plot a horizontal line)
  const averageData = new Array(data.length).fill(averageScore);

  if(scoreChartInstance) {
    scoreChartInstance.destroy();
  }

  scoreChartInstance = new Chart(scoreChartCtx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Game Scores Over Time',
          data: data,
          borderColor: 'rgba(143, 122, 102, 0.8)',
          backgroundColor: 'rgba(143, 122, 102, 0.3)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 6,
        },
        {
          label: 'Average Score',
          data: averageData,
          borderColor: 'rgba(100, 149, 237, 0.8)', // Cornflower blue
          borderDash: [10,5], // dashed line
          fill: false,
          pointRadius: 0,
          borderWidth: 2,
	  
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: { display: true, title: { display: true, text: 'Date & Time' } },
        y: { display: true, title: { display: true, text: 'Score' }, beginAtZero: true }
      }
    }
  });
}


  // Keyboard controls
  window.addEventListener('keydown', e => {
    if(message.textContent !== '') return;
    switch(e.key) {
      case 'ArrowLeft':
        e.preventDefault();
        move('left');
        break;
      case 'ArrowRight':
        e.preventDefault();
        move('right');
        break;
      case 'ArrowUp':
        e.preventDefault();
        move('up');
        break;
      case 'ArrowDown':
        e.preventDefault();
        move('down');
        break;
    }
  });

  // Restart button resets the game
  restartBtn.addEventListener('click', () => {
    initBoard();
    if (solverInterval !== null) {
      resetLiveSolverPolicy();
    }
  });

  // Reset high score button clears localStorage and updates display
  resetHighScoreBtn.addEventListener('click', () => {
    localStorage.removeItem('highScore');
    highScore = 0;
    highScoreDisplay.textContent = 'High Score: 0';

    // Optionally clear all scores and update chart
    scores = [];
    localStorage.removeItem('scores');
    plotScores();
  });

  // Undo button listener
  const undoBtn = document.getElementById('undoBtn');
  if (undoBtn) {
    undoBtn.addEventListener('click', () => {
      // If solver is running, stop it to avoid conflicts
      stopSolver();
      undo();
    });
  }

  // Simulator button event listener
  const runSimBtn = document.getElementById('runSimBtn');
  if (runSimBtn) {
    runSimBtn.addEventListener('click', () => {
      const policy = document.getElementById('simPolicySelect').value;
      displaySimulationResults(policy);
    });
  }

  // Keyboard shortcut: 'z' key to undo (works even if game over message shown)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'z' || e.key === 'Z') {
      e.preventDefault();
      // Stop solver to avoid conflicts
      stopSolver();
      undo();
    }
  });

  // Keyboard shortcut: Space toggles the pattern solver (start/stop)
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (solverInterval !== null) {
        stopSolver();
        return;
      }

      startSolver();
    }
  });

  // Initialize the game and plot existing scores on page load
  initBoard();
  plotScores();
  displayAverageScore();

function displayAverageScore() {
  if (!scores || scores.length === 0) {
    document.getElementById('averageScoreDisplay').textContent = 'Average Score: 0';
    return;
  }
  const total = scores.reduce((sum, entry) => sum + entry.score, 0);
  const avg = total / scores.length;
  document.getElementById('averageScoreDisplay').textContent = 'Average Score: ' + avg.toFixed(2);
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault(); // prevent default browser actions (optional)

    // Restart the game
    initBoard();

    // Start the solver if not already running
    if (solverInterval === null) {
      startSolver();
    } else {
      resetLiveSolverPolicy();
    }
  }
});
