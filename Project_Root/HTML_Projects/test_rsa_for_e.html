<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSA Key Generation and Choosing e</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 2em;
    background: #f0f4f8;
    color: #222;
  }
  button {
    background: #007bff;
    border: none;
    color: white;
    padding: 0.6em 1em;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
    margin-top: 1em;
  }
  .output {
    margin-top: 1em;
    background: white;
    border-radius: 6px;
    padding: 1em;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    font-family: monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>RSA Key Generation Demo: Choosing \(e\)</h1>
<button id="generateBtn">Generate Keys</button>

<div id="output" class="output"></div>

<script>
// Simple prime check
function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++)
    if (n % i === 0) return false;
  return true;
}

// Generate random prime between min and max
function generatePrime(min = 50, max = 150) {
  let p;
  do {
    p = Math.floor(Math.random() * (max - min)) + min;
  } while (!isPrime(p));
  return p;
}

// Compute gcd
function gcd(a, b) {
  while (b !== 0) {
    [a, b] = [b, a % b];
  }
  return a;
}

// Extended Euclidean Algorithm for modular inverse
function egcd(a, b) {
  if (b === 0) return [a, 1, 0];
  const [g, x1, y1] = egcd(b, a % b);
  return [g, y1, x1 - Math.floor(a / b) * y1];
}

// Modular inverse
function modInverse(e, phi) {
  const [g, x] = egcd(e, phi);
  if (g !== 1) throw 'No modular inverse';
  return (x % phi + phi) % phi;
}

const output = document.getElementById('output');
const generateBtn = document.getElementById('generateBtn');

generateBtn.onclick = () => {
  output.textContent = '';
  
  let p, q, n, phi, e, d;
  let attempts = 0;
  
  // Keep trying until we find suitable primes and e
  while (true) {
    attempts++;
    p = generatePrime();
    q = generatePrime();
    n = p * q;
    phi = (p - 1) * (q - 1);

    // Common public exponent candidates
    const commonEs = [65537, 17, 3];
    
    // Try each candidate e until one is coprime with phi
    for (let candidate of commonEs) {
      if (candidate < phi && gcd(candidate, phi) === 1) {
        e = candidate;
        try {
          d = modInverse(e, phi);
          output.textContent += `Attempt ${attempts}:\n`;
          output.textContent += `p = ${p}, q = ${q}\n`;
          output.textContent += `n = ${n}\n`;
          output.textContent += `phi = ${phi}\n`;
          output.textContent += `Chosen e = ${e}\n`;
          output.textContent += `Computed d (modular inverse of e mod phi) = ${d}\n\n`;
          break;
        } catch {
          // modular inverse failed, try next candidate
          continue;
        }
      }
    }
    
    if (e && d) break; // found suitable keys
  }
};
</script>

</body>
</html>
