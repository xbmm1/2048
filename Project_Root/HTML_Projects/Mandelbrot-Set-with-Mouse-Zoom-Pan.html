<!DOCTYPE html>
<html>
<head>
  <title>Mandelbrot Set with Mouse Zoom & Pan</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    canvas {
      border: 1px solid #555;
      cursor: grab;
      display: block;
      margin: 20px auto;
      background: black;
      max-width: 100%;
      height: auto;
    }
    .controls {
      max-width: 900px;
      margin: 0 auto 20px;
      text-align: left;
    }
    .controls button {
      margin-top: 10px;
      padding: 7px 14px;
      background: #2b7cff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .controls button:hover {
      background: #4b90ff;
    }
    #jumpLabel {
      margin-top: 6px;
      font-size: 13px;
      color: #aaa;
    }
    #renderStatus {
      margin-top: 10px;
      font-size: 13px;
      color: #7fd67f;
      min-height: 18px;
    }
    .controls label.checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h1>Mandelbrot Set Visualization</h1>

<canvas id="mandelbrotCanvas" width="1280" height="720"></canvas>

<div class="controls">
  <label for="iterationRange">Max Iterations: <span id="iterationValue">100</span></label><br/>
  <input type="range" id="iterationRange" min="10" max="1000" value="100" step="10" />
  <br/><br/>
  <label for="paletteShiftRange">Palette Shift: <span id="paletteShiftValue">0.00</span></label><br/>
  <input type="range" id="paletteShiftRange" min="0" max="1" value="0" step="0.01" />
  <br/>
  <button id="randomJumpBtn">Random Jump</button>
  <div id="jumpLabel"></div>
  <br/>
  <label class="checkbox-label">
    <input type="checkbox" id="useWorkersCheckbox" checked />
    Use tile-based Web Workers (parallel rendering)
  </label>
  <div id="renderStatus"></div>
</div>

<script>
  const canvas = document.getElementById('mandelbrotCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;

  // Bounds widened horizontally (vs. the original 600x600 square) to match
  // the 1920x1080 (16:9) canvas aspect ratio without stretching the fractal.
  const originalBounds = {
    xmin: -3.41667,
    xmax: 1.91667,
    ymin: -1.5,
    ymax: 1.5
  };

  let zoom = 1;
  let offsetX = 0;
  let offsetY = 0;
  let maxIterations = 100;
  let paletteShift = 0;

  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragStartOffset = { x: 0, y: 0 };

  const iterationRange = document.getElementById('iterationRange');
  const iterationValue = document.getElementById('iterationValue');
  const paletteShiftRange = document.getElementById('paletteShiftRange');
  const paletteShiftValue = document.getElementById('paletteShiftValue');
  const useWorkersCheckbox = document.getElementById('useWorkersCheckbox');
  const renderStatus = document.getElementById('renderStatus');

  iterationRange.addEventListener('input', () => {
    maxIterations = parseInt(iterationRange.value, 10);
    iterationValue.textContent = maxIterations;
    requestRender();
  });

  paletteShiftRange.addEventListener('input', () => {
    paletteShift = parseFloat(paletteShiftRange.value);
    paletteShiftValue.textContent = paletteShift.toFixed(2);
    requestRender();
  });

  useWorkersCheckbox.addEventListener('change', () => {
    requestRender();
  });

  function pixelToComplex(x, y) {
    const viewWidth = (originalBounds.xmax - originalBounds.xmin) / zoom;
    const viewHeight = (originalBounds.ymax - originalBounds.ymin) / zoom;

    const real = originalBounds.xmin + offsetX + (x / width) * viewWidth;
    const imag = originalBounds.ymin + offsetY + (y / height) * viewHeight;

    return { real, imag };
  }

  function mandelbrotIterations(cReal, cImag, maxIter) {
    let zReal = 0;
    let zImag = 0;
    let n = 0;

    while (n < maxIter) {
      const zRealSquared = zReal * zReal;
      const zImagSquared = zImag * zImag;

      if (zRealSquared + zImagSquared > 4) break;

      const tempZReal = zRealSquared - zImagSquared + cReal;
      zImag = 2 * zReal * zImag + cImag;
      zReal = tempZReal;

      n++;
    }
    return n;
  }

  function getColor(iter, maxIter, paletteShift) {
    if (iter === maxIter) {
      return [0, 0, 0];
    }
    let t = (iter / maxIter + paletteShift) % 1;
    const r = Math.floor(9 * (1 - t) * t * t * t * 255);
    const g = Math.floor(15 * (1 - t) * (1 - t) * t * t * 255);
    const b = Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
    return [r, g, b];
  }

  // ============ SINGLE-THREAD RENDER PATH (fallback / comparison) ============
  function drawMandelbrotSingleThread() {
    const startTime = performance.now();

    const imageData = ctx.createImageData(width, height);
    const data = imageData.data;

    const viewWidth = (originalBounds.xmax - originalBounds.xmin) / zoom;
    const viewHeight = (originalBounds.ymax - originalBounds.ymin) / zoom;

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const cReal = originalBounds.xmin + offsetX + (x / width) * viewWidth;
        const cImag = originalBounds.ymin + offsetY + (y / height) * viewHeight;

        const iter = mandelbrotIterations(cReal, cImag, maxIterations);
        const [r, g, b] = getColor(iter, maxIterations, paletteShift);

        const idx = (y * width + x) * 4;
        data[idx] = r;
        data[idx + 1] = g;
        data[idx + 2] = b;
        data[idx + 3] = 255;
      }
    }

    ctx.putImageData(imageData, 0, 0);

    const elapsed = performance.now() - startTime;
    renderStatus.textContent = `Rendered in ${elapsed.toFixed(1)}ms (single-threaded, 1 core)`;
  }

  // ============ TILE-BASED WEB WORKER PARALLEL RENDER PATH ============
  const TILE_SIZE = 64;
  const numWorkers = Math.max(1, navigator.hardwareConcurrency || 4);

  // Defined only so its source can be extracted via .toString() - never called
  // directly on the main thread.
  function workerTileHandler(e) {
    const { tileId, generation, x0, y0, tileWidth, tileHeight, params } = e.data;
    const { width, height, xmin, ymin, viewWidth, viewHeight, offsetX, offsetY, maxIterations, paletteShift } = params;

    const pixels = new Uint8ClampedArray(tileWidth * tileHeight * 4);

    for (let ty = 0; ty < tileHeight; ty++) {
      const y = y0 + ty;
      const cImag = ymin + offsetY + (y / height) * viewHeight;
      for (let tx = 0; tx < tileWidth; tx++) {
        const x = x0 + tx;
        const cReal = xmin + offsetX + (x / width) * viewWidth;

        const iter = mandelbrotIterations(cReal, cImag, maxIterations);
        const [r, g, b] = getColor(iter, maxIterations, paletteShift);

        const idx = (ty * tileWidth + tx) * 4;
        pixels[idx] = r;
        pixels[idx + 1] = g;
        pixels[idx + 2] = b;
        pixels[idx + 3] = 255;
      }
    }

    self.postMessage(
      { type: 'tileDone', tileId, generation, x0, y0, tileWidth, tileHeight, buffer: pixels.buffer },
      [pixels.buffer]
    );
  }

  const MANDELBROT_WORKER_SOURCE = [
    mandelbrotIterations.toString(),
    getColor.toString(),
    'self.onmessage = ' + workerTileHandler.toString() + ';'
  ].join('\n\n');

  let mandelbrotWorkerUrl = null;
  function getMandelbrotWorkerUrl() {
    if (!mandelbrotWorkerUrl) {
      const blob = new Blob([MANDELBROT_WORKER_SOURCE], { type: 'application/javascript' });
      mandelbrotWorkerUrl = URL.createObjectURL(blob);
    }
    return mandelbrotWorkerUrl;
  }

  let workerPool = [];
  let workerBusy = [];
  let renderGeneration = 0;
  let tileQueue = [];
  let tilesRemaining = 0;
  let totalTileCount = 0;
  let parallelRenderStartTime = 0;

  function initWorkerPool() {
    if (workerPool.length > 0 || typeof Worker === 'undefined') return;

    const workerUrl = getMandelbrotWorkerUrl();
    for (let i = 0; i < numWorkers; i++) {
      const worker = new Worker(workerUrl);
      worker.onmessage = (e) => handleWorkerMessage(i, e);
      workerPool.push(worker);
      workerBusy.push(false);
    }
  }

  function buildTileQueue() {
    const queue = [];
    let tileId = 0;
    for (let y0 = 0; y0 < height; y0 += TILE_SIZE) {
      const tileHeight = Math.min(TILE_SIZE, height - y0);
      for (let x0 = 0; x0 < width; x0 += TILE_SIZE) {
        const tileWidth = Math.min(TILE_SIZE, width - x0);
        queue.push({ tileId: tileId++, x0, y0, tileWidth, tileHeight });
      }
    }
    return queue;
  }

  function dispatchNextTile(workerIndex) {
    if (tileQueue.length === 0) {
      workerBusy[workerIndex] = false;
      return;
    }

    const tile = tileQueue.shift();
    workerBusy[workerIndex] = true;

    const viewWidth = (originalBounds.xmax - originalBounds.xmin) / zoom;
    const viewHeight = (originalBounds.ymax - originalBounds.ymin) / zoom;

    workerPool[workerIndex].postMessage({
      tileId: tile.tileId,
      generation: renderGeneration,
      x0: tile.x0,
      y0: tile.y0,
      tileWidth: tile.tileWidth,
      tileHeight: tile.tileHeight,
      params: {
        width,
        height,
        xmin: originalBounds.xmin,
        ymin: originalBounds.ymin,
        viewWidth,
        viewHeight,
        offsetX,
        offsetY,
        maxIterations,
        paletteShift
      }
    });
  }

  function handleWorkerMessage(workerIndex, e) {
    const msg = e.data;
    if (msg.type !== 'tileDone') return;

    // Ignore results from a render that has since been superseded.
    if (msg.generation === renderGeneration) {
      const pixels = new Uint8ClampedArray(msg.buffer);
      const tileImageData = new ImageData(pixels, msg.tileWidth, msg.tileHeight);
      ctx.putImageData(tileImageData, msg.x0, msg.y0);

      tilesRemaining--;
      if (tilesRemaining === 0) {
        const elapsed = performance.now() - parallelRenderStartTime;
        renderStatus.textContent = `Rendered in ${elapsed.toFixed(1)}ms using ${numWorkers} workers (${totalTileCount} tiles)`;
      }
    }

    dispatchNextTile(workerIndex);
  }

  function drawMandelbrotParallel() {
    initWorkerPool();

    renderGeneration++;
    tileQueue = buildTileQueue();
    totalTileCount = tileQueue.length;
    tilesRemaining = totalTileCount;
    parallelRenderStartTime = performance.now();

    for (let i = 0; i < workerPool.length; i++) {
      if (!workerBusy[i]) {
        dispatchNextTile(i);
      }
    }
  }

  // Dispatcher: picks the parallel tile-based path or the single-threaded
  // fallback based on the checkbox and Worker support.
  function drawMandelbrot() {
    if (useWorkersCheckbox.checked && typeof Worker !== 'undefined') {
      drawMandelbrotParallel();
    } else {
      renderGeneration++; // invalidate any in-flight parallel tiles
      drawMandelbrotSingleThread();
    }
  }

  // Coalesces multiple rapid render triggers (e.g. mousemove during drag)
  // into a single render per animation frame.
  let renderRequested = false;
  function requestRender() {
    if (renderRequested) return;
    renderRequested = true;
    requestAnimationFrame(() => {
      renderRequested = false;
      drawMandelbrot();
    });
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const { real: mouseReBefore, imag: mouseImBefore } = pixelToComplex(mouseX, mouseY);

    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    zoom *= zoomFactor;
    zoom = Math.min(Math.max(zoom, 1), 1e10);

    const { real: mouseReAfter, imag: mouseImAfter } = pixelToComplex(mouseX, mouseY);

    offsetX += mouseReBefore - mouseReAfter;
    offsetY += mouseImBefore - mouseImAfter;

    requestRender();
  });

  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    isDragging = true;
    dragStart.x = e.clientX;
    dragStart.y = e.clientY;
    dragStartOffset.x = offsetX;
    dragStartOffset.y = offsetY;
    canvas.style.cursor = 'grabbing';
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      canvas.style.cursor = 'grab';
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;

    const viewWidth = (originalBounds.xmax - originalBounds.xmin) / zoom;
    const viewHeight = (originalBounds.ymax - originalBounds.ymin) / zoom;

    offsetX = dragStartOffset.x - dx / width * viewWidth;
    offsetY = dragStartOffset.y - dy / height * viewHeight;

    requestRender();
  });

  const randomJumpBtn = document.getElementById('randomJumpBtn');
  const jumpLabel = document.getElementById('jumpLabel');

  const jumpSpots = [
    { name: 'Seahorse Valley',  cx: -0.7436438870371587, cy:  0.13182590420531197, zoom: 8000 },
    { name: 'Elephant Valley',  cx:  0.285,              cy:  0.01,               zoom: 400 },
    { name: 'Triple Spiral',    cx: -0.088,              cy:  0.654,              zoom: 300 },
    { name: 'Needle Point',     cx: -1.25066,            cy:  0.02012,            zoom: 50000 },
    { name: 'Mini Mandelbrot',  cx: -1.7498,             cy:  0.0,               zoom: 2000 },
    { name: 'Spiral Coast',     cx: -0.761574,           cy: -0.0847596,         zoom: 60000 },
    { name: 'Antenna',          cx: -1.401155,           cy:  0.0,               zoom: 5000 },
    { name: 'Upper Bulb Edge',  cx: -0.16,               cy:  1.04,              zoom: 150 }
  ];

  function jumpToRandom() {
    const spot = jumpSpots[Math.floor(Math.random() * jumpSpots.length)];
    const viewWidth  = (originalBounds.xmax - originalBounds.xmin);
    const viewHeight = (originalBounds.ymax - originalBounds.ymin);
    zoom = spot.zoom;
    // Center the view on the spot by computing the needed offsets
    offsetX = spot.cx - originalBounds.xmin - (viewWidth  / zoom) / 2;
    offsetY = spot.cy - originalBounds.ymin - (viewHeight / zoom) / 2;
    jumpLabel.textContent = 'Jumped to: ' + spot.name;
    requestRender();
  }

  randomJumpBtn.addEventListener('click', jumpToRandom);

  requestRender();
</script>

</body>
</html>
