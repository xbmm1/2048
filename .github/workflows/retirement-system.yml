name: Retirement system
on:
  push:
    paths: ['Project_Root/retirement-system/**', '.github/workflows/retirement-system.yml']
  pull_request:
    paths: ['Project_Root/retirement-system/**', '.github/workflows/retirement-system.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_Root/retirement-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sh mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-test-results
          path: |
            Project_Root/retirement-system/target/surefire-reports/
            Project_Root/retirement-system/target/failsafe-reports/
            Project_Root/retirement-system/target/qa/
